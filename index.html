/* Layout: one pixel-art stage centred on a night-blue frame, hint strip and touch pad below. */
:root{
  --bg:#14102b; --panel:#221a47; --fg:#fff1d6; --muted:#a79bd6; --accent:#ffa94d; --moon:#8f8bff;
  --font-display:"Press Start 2P",ui-monospace,Menlo,monospace; --font-body:"Nunito",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}body{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);
  padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;overflow:hidden;-webkit-user-select:none;user-select:none}
#c{width:min(100%,calc((100dvh - 66px)*1.7647));max-width:none;aspect-ratio:480/272;image-rendering:pixelated;
  border:3px solid var(--panel);border-radius:4px;background:#000;touch-action:none;outline:none}
.hint{font-size:13px;color:var(--muted);text-align:center;display:flex;flex-wrap:wrap;gap:6px 16px;justify-content:center;max-width:100%}
.hint b{color:var(--accent);font-family:var(--font-display);font-size:10px;font-weight:400;margin-right:4px}
.pad{display:none;width:100%;max-width:560px;justify-content:space-between;gap:12px}
.pad div{display:flex;gap:10px}
.pad button{font:400 14px var(--font-display);width:64px;height:64px;border-radius:50%;border:3px solid var(--moon);background:var(--panel);color:var(--fg);touch-action:none}
.pad button:active{background:var(--moon);color:#14102b}
body{overscroll-behavior:none;-webkit-touch-callout:none;touch-action:manipulation}
.pad button{font:700 28px system-ui,sans-serif;line-height:1;padding:0}
@media (pointer:coarse){.pad{display:flex}.hint{display:none}.pad button{width:72px;height:72px}}
@media (pointer:coarse) and (orientation:portrait){#c{width:100%}body{justify-content:center;gap:28px}.pad{box-sizing:border-box;padding:0 4px}.pad{gap:6px}.pad div{gap:min(10px,2vw)}.pad button{width:min(62px,13.4vw);height:min(62px,13.4vw);font-size:22px}}
@media (pointer:coarse) and (orientation:landscape){body{padding-block:2px;gap:0;justify-content:center}#c{width:min(100%,calc((100dvh - 6px)*1.7647));border-width:2px}
 .pad{position:fixed;left:0;right:0;bottom:0;width:auto;box-sizing:border-box;max-width:none;padding:0 max(14px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));pointer-events:none;z-index:5}
 .pad button{pointer-events:auto;opacity:.7;width:64px;height:64px}}
button:focus-visible{outline:3px solid var(--accent)}
:fullscreen .hint,:fullscreen .rot{display:none}:fullscreen body{padding:0;gap:0}:fullscreen #c{width:min(100vw,calc(100dvh*1.7647));border:0;border-radius:0}
:-webkit-full-screen .hint{display:none}:-webkit-full-screen body{padding:0;gap:0}:-webkit-full-screen #c{width:min(100vw,calc(100vh*1.7647));border:0;border-radius:0}
.pad{touch-action:none}.pad button{-webkit-tap-highlight-color:transparent;transition:transform .05s}.pad{zoom:var(--pz,1)}.pad.lefty{flex-direction:row-reverse}
.pad.d5 button{width:min(62px,11.4vw)!important;height:min(62px,11.4vw)!important}
.pad button.on{background:var(--moon);color:#14102b;transform:scale(.93)}
.rot{display:none;font-size:13px;color:var(--muted);text-align:center}
/* phones and tablets held upright: turn the whole game sideways so it always plays in landscape */
html.fl body{position:fixed;left:0;top:0;width:100vh;height:100vw;width:100dvh;height:100dvw;transform-origin:0 0;transform:rotate(90deg) translateY(-100%);padding:2px 14px;gap:0;justify-content:center}
html.fl #c{width:min(100%,calc((100vw - 6px)*1.7647));width:min(100%,calc((100dvw - 6px)*1.7647));border-width:2px}
html.fl .pad{position:fixed;left:0;right:0;bottom:0;width:auto;box-sizing:border-box;max-width:none;padding:0 14px 8px 14px;pointer-events:none;z-index:5;gap:12px}
html.fl .pad div{gap:10px}
html.fl .pad button,html.fl .pad.d5 button{pointer-events:auto;opacity:.7;width:64px!important;height:64px!important;font-size:28px}
html.fl .rot,html.fl .hint{display:none}
@media (pointer:coarse) and (orientation:portrait){.rot{display:block}}
#nm-wrap{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:rgba(10,8,30,.72)}
#nm-wrap[hidden]{display:none}
.nm-box{background:var(--panel);border:3px solid var(--moon);border-radius:6px;padding:16px 18px;display:flex;flex-direction:column;gap:12px;align-items:center;width:min(86vw,300px);-webkit-user-select:text;user-select:text}
.nm-box label{font:400 11px var(--font-display);color:var(--accent)}
.nm-box input{width:100%;box-sizing:border-box;font:400 16px var(--font-display);text-align:center;text-transform:uppercase;padding:10px 6px;background:#0e0a24;color:var(--fg);border:3px solid var(--moon);border-radius:4px;outline:none}
.nm-box div{display:flex;gap:10px}
.nm-box button{font:400 11px var(--font-display);padding:10px 14px;background:var(--moon);color:#14102b;border:0;border-radius:4px}
.nm-box button#nm-no{background:#3a2f6b;color:var(--fg)}
</style>

const TS=16,VW=480,VH=272,ROWS=17;
const cv=document.getElementById('c');let ctx=cv.getContext('2d');cv.width=VW;cv.height=VH;ctx.imageSmoothingEnabled=false;
const keys={},pressed={};
function kd(code){if(!keys[code])pressed[code]=true;keys[code]=true;initAudio();}
function ku(code){keys[code]=false;}
addEventListener('keydown',e=>{if(e.target&&e.target.id==='nm')return;if(typeof keyCap==='function'&&keyCap(e))return;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','Tab'].includes(e.code))e.preventDefault();if(!e.repeat)kd(e.code);});
addEventListener('keyup',e=>{if(e.target&&e.target.id==='nm')return;ku(e.code)});

// auto-landscape: try the real orientation lock, otherwise rotate the page with CSS when a touch device is held upright
const FL=()=>document.documentElement.classList.contains('fl');
function updFL(){try{const on=matchMedia('(pointer:coarse)').matches&&innerHeight>innerWidth;document.documentElement.classList.toggle('fl',on);if(typeof fitCanvas==='function')fitCanvas();}catch(e){}}
function tryLock(){try{if(!matchMedia('(pointer:coarse)').matches||innerHeight<=innerWidth)return;const o=screen.orientation;if(!o||!o.lock)return;const go=()=>{o.lock('landscape').then(()=>setTimeout(updFL,300)).catch(()=>{});};
 const de=document.documentElement;if(!document.fullscreenElement&&de.requestFullscreen&&!/iPhone|iPad|iPod/.test(navigator.userAgent)){de.requestFullscreen().then(go).catch(go);}else go();}catch(e){}}
addEventListener('resize',updFL);addEventListener('orientationchange',()=>setTimeout(updFL,250));addEventListener('pointerdown',tryLock,{once:true});updFL();
// touch pad: multi-touch, haptics, and the thumb can slide between ◀ and ▶ without lifting
(()=>{const btns=[...document.querySelectorAll('.pad button')],dirK=['ArrowLeft','ArrowRight'],byK={};btns.forEach(b=>byK[b.dataset.k]=b);
 const grp=byK.ArrowLeft&&byK.ArrowLeft.parentElement,held=new Map();
 const buzz=()=>{try{if(navigator.vibrate)navigator.vibrate(8);}catch(e){}};
 const show=(k,on)=>{if(byK[k])byK[k].classList.toggle('on',on);};
 const dirAt=e=>{const r=grp.getBoundingClientRect();return(FL()?e.clientY<r.top+r.height/2:e.clientX<r.left+r.width/2)?'ArrowLeft':'ArrowRight';};
 const press=(id,k)=>{held.set(id,k);kd(k);show(k,true);buzz();};
 const release=id=>{const k=held.get(id);if(!k)return;held.delete(id);if(![...held.values()].includes(k)){ku(k);show(k,false);}};
 btns.forEach(b=>{const k=b.dataset.k,isDir=dirK.includes(k);
  b.addEventListener('contextmenu',e=>e.preventDefault());
  b.addEventListener('pointerdown',e=>{e.preventDefault();try{b.setPointerCapture(e.pointerId);}catch(_){}press(e.pointerId,isDir?dirAt(e):k);});
  b.addEventListener('pointermove',e=>{if(!isDir||!held.has(e.pointerId))return;const nk=dirAt(e);if(nk!==held.get(e.pointerId)){release(e.pointerId);press(e.pointerId,nk);}});
  const up=e=>release(e.pointerId);b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('lostpointercapture',up);});
 addEventListener('blur',()=>{held.clear();btns.forEach(b=>b.classList.remove('on'));});})();
const K={left:['ArrowLeft','KeyA'],right:['ArrowRight','KeyD'],jump:['Space','ArrowUp','KeyW','KeyK'],moon:['KeyZ','ShiftLeft','ShiftRight','KeyJ'],tail:['KeyX','KeyL'],magic:['KeyC'],dash:['KeyV','KeyB'],spell:['KeyQ','KeyE'],ok:['Enter','Space'],back:['Escape','KeyP']};
const down=n=>K[n].some(c=>keys[c]);
const hit=n=>K[n].some(c=>pressed[c]);
// save
let save={stars:{},coins:0,costume:0,unlocked:1,best:{},owned:[0,1]};
try{const s=JSON.parse(localStorage.getItem('whiskerbound')||'{}');Object.assign(save,s);}catch(e){}
if(!Array.isArray(save.owned))save.owned=[0,1];if(!Array.isArray(save.ownS))save.ownS=[];if(save.hat===undefined)save.hat=-1;if(save.trail===undefined)save.trail=-1;if(!save.gems)save.gems={};if(!save.gset)save.gset={};if(!save.bt)save.bt={};if(!save.bc)save.bc={};
if(!save.prog){let m=0;for(const k in save.stars)m=Math.max(m,+k+2);save.unlocked=Math.max(1,m);save.prog=1;}
const UNL=()=>(typeof UNLOCKALL!=='undefined'&&UNLOCKALL)?100:save.unlocked;
function persist(){try{localStorage.setItem('whiskerbound',JSON.stringify(save));}catch(e){}}
const totalStars=()=>Object.values(save.stars).reduce((a,b)=>a+b,0);
// audio
let AC=null,muted=!!save.muted,musicOn=save.music!==false;
function setMuted(v){muted=v;save.muted=v;persist();}
function setMusic(v){musicOn=v;save.music=v;persist();}
function applyPrefs(){try{const z=[.86,1,1.14][save.bs===undefined?1:save.bs];document.documentElement.style.setProperty('--pz',z);document.querySelectorAll('.pad').forEach(e=>e.classList.toggle('lefty',!!save.lefty));}catch(e){}}
function initAudio(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();}
const sfxVol=()=>(save.vs===undefined?10:save.vs)/10,musVol=()=>(save.vm===undefined?10:save.vm)/10;
function beep(f,d=.1,type='square',vol=.04,slide=0,delay=0){if(!AC||muted||sfxVol()<=0)return;vol*=sfxVol();try{const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+slide),t+d);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d);}catch(e){}}
const SFX={jump:()=>beep(340,.14,'square',.04,320),dj:()=>beep(520,.12,'square',.04,320),coin:()=>{beep(988,.06);beep(1319,.12,'square',.04,0,.06)},
 star:()=>[660,880,1100,1320].forEach((f,i)=>beep(f,.14,'triangle',.06,0,i*.07)),heart:()=>{beep(520,.1,'triangle',.06);beep(780,.18,'triangle',.06,0,.1)},
 stomp:()=>beep(200,.12,'square',.06,-120),hurt:()=>beep(220,.3,'sawtooth',.06,-160),bell:()=>{beep(880,.5,'sine',.08);beep(1320,.5,'sine',.04)},
 tail:()=>beep(300,.1,'triangle',.05,200),die:()=>beep(300,.6,'sawtooth',.06,-250),win:()=>[523,659,784,1047].forEach((f,i)=>beep(f,.25,'square',.05,0,i*.12)),
 ui:()=>beep(700,.05,'square',.03),boss:()=>beep(110,.25,'sawtooth',.08,-40)};
// helpers
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const approach=(v,t,a)=>v<t?Math.min(t,v+a):Math.max(t,v-a);
const lerp=(a,b,t)=>a+(b-a)*t;
const rnd=s=>{s=Math.sin(s*127.1+311.7)*43758.5453;return s-Math.floor(s);};
const R=(c,x,y,w,h)=>{ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),w,h);};
function mk(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.imageSmoothingEnabled=false;return[c,x];}
const SOLID_ALWAYS={1:1,2:1,7:1};

// sprites.js - procedural pixel art for FLAPPY CAT
// Every sprite is drawn on a tiny pixel grid, auto-outlined, then scaled up by the game.
(function (root) {
  'use strict';

  var OUT = '#543847';

  // ---- tiny pixel buffer ------------------------------------------------------
  function Buf(w, h) {
    this.w = w; this.h = h; this.p = [];
    for (var i = 0; i < w * h; i++) this.p.push(null);
  }
  Buf.prototype.get = function (x, y) {
    if (x < 0 || y < 0 || x >= this.w || y >= this.h) return null;
    return this.p[y * this.w + x];
  };
  Buf.prototype.set = function (x, y, c) {
    x = Math.round(x); y = Math.round(y);
    if (x >= 0 && y >= 0 && x < this.w && y < this.h) this.p[y * this.w + x] = c;
    return this;
  };
  Buf.prototype.rect = function (x, y, w, h, c) {
    for (var j = 0; j < h; j++) for (var i = 0; i < w; i++) this.set(x + i, y + j, c);
    return this;
  };
  Buf.prototype.span = function (y, x0, x1, c) {
    for (var x = x0; x <= x1; x++) this.set(x, y, c);
    return this;
  };
  Buf.prototype.spans = function (list, c) {
    for (var i = 0; i < list.length; i++) this.span(list[i][0], list[i][1], list[i][2], c);
    return this;
  };
  Buf.prototype.dots = function (list, c) {
    for (var i = 0; i < list.length; i++) this.set(list[i][0], list[i][1], c);
    return this;
  };
  // filled ellipse; if `only` is given, paints only over pixels of that colour
  Buf.prototype.ell = function (cx, cy, rx, ry, c, only) {
    for (var y = Math.floor(cy - ry) - 1; y <= Math.ceil(cy + ry) + 1; y++) {
      for (var x = Math.floor(cx - rx) - 1; x <= Math.ceil(cx + rx) + 1; x++) {
        var dx = (x - cx) / rx, dy = (y - cy) / ry;
        if (dx * dx + dy * dy <= 1 && (!only || this.get(x, y) === only)) this.set(x, y, c);
      }
    }
    return this;
  };
  Buf.prototype.erase = function (cx, cy, rx, ry) { return this.ell(cx, cy, rx, ry, null); };
  Buf.prototype.line = function (x0, y0, x1, y1, c, th) {
    th = th || 1;
    var a = -Math.floor((th - 1) / 2);
    var dx = Math.abs(x1 - x0), dy = Math.abs(y1 - y0);
    var sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1, err = dx - dy;
    for (;;) {
      this.rect(x0 + a, y0 + a, th, th, c);
      if (x0 === x1 && y0 === y1) break;
      var e2 = 2 * err;
      if (e2 > -dy) { err -= dy; x0 += sx; }
      if (e2 < dx) { err += dx; y0 += sy; }
    }
    return this;
  };
  // recolour pixels of colour `from` that have an empty neighbour in direction (dx,dy)
  Buf.prototype.edge = function (from, to, dx, dy) {
    var snap = this.p.slice(), w = this.w, h = this.h;
    for (var y = 0; y < h; y++) for (var x = 0; x < w; x++) {
      if (snap[y * w + x] !== from) continue;
      var nx = x + dx, ny = y + dy;
      var nb = (nx < 0 || ny < 0 || nx >= w || ny >= h) ? null : snap[ny * w + nx];
      if (nb === null) this.p[y * w + x] = to;
    }
    return this;
  };
  Buf.prototype.outline = function (c) {
    var snap = this.p.slice(), w = this.w, h = this.h;
    for (var y = 0; y < h; y++) for (var x = 0; x < w; x++) {
      if (snap[y * w + x] !== null) continue;
      if ((x > 0 && snap[y * w + x - 1] !== null) || (x < w - 1 && snap[y * w + x + 1] !== null) ||
          (y > 0 && snap[(y - 1) * w + x] !== null) || (y < h - 1 && snap[(y + 1) * w + x] !== null)) {
        this.p[y * w + x] = c;
      }
    }
    return this;
  };

  // ---- THE CAT ----------------------------------------------------------------
  var NOSE = '#e8809a', BLUSH = '#f9b3c4', WH = '#ffffff', MOUTH = '#8a2f46', TONG = '#ff8fa8',
      BELL = '#ffd04a', BELLD = '#e8a830';

  // Cat colours. G = body, L = belly/muzzle/tail tip, D = shade + far legs, PAW/PAWD = paws,
  // PNK = inner ears, EYE = eye colour, COL = collar. `price` is the shop price in coins.
  var PALETTES = [
    { name: 'GRAY',   price: 0,   G: '#c9c8d3', L: '#efedf5', D: '#9b99ab', PAW: '#f6f4fa', PAWD: '#c3c1d1', PNK: '#f6a9bb', EYE: '#2d2433', COL: '#ff6f91' },
    { name: 'CREAM',  price: 10,  G: '#f3dcb0', L: '#fff7e6', D: '#d6b883', PAW: '#fffaf0', PAWD: '#e2cfa6', PNK: '#f6a9bb', EYE: '#2d2433', COL: '#ff6f91' },
    { name: 'ORANGE', price: 30,  G: '#f4a24c', L: '#ffe3bd', D: '#d17a26', PAW: '#fff0dc', PAWD: '#e8b98a', PNK: '#f6a9bb', EYE: '#2d2433', COL: '#4aa6d6' },
    { name: 'BLACK',  price: 60,  G: '#5b5870', L: '#8f8ca6', D: '#3d3a4d', PAW: '#a19eb8', PAWD: '#6e6b84', PNK: '#e8809a', EYE: '#ffe27a', COL: '#ff6f91' },
    { name: 'PINK',   price: 100, G: '#f7b6cb', L: '#fff0f5', D: '#d98aa8', PAW: '#fff6f9', PAWD: '#e7b0c4', PNK: '#e86f9a', EYE: '#2d2433', COL: '#8a6de0' },
    { name: 'BLUE',   price: 160, G: '#9fd0f5', L: '#e8f5ff', D: '#6ea6d6', PAW: '#f2faff', PAWD: '#b6d6ee', PNK: '#f6a9bb', EYE: '#2d2433', COL: '#ff6f91' },
    { name: 'PURPLE', price: 260, G: '#b69be8', L: '#efe6ff', D: '#8468c2', PAW: '#f6f0ff', PAWD: '#cdbcf0', PNK: '#f6a9bb', EYE: '#2d2433', COL: '#ffd04a' },
    { name: 'GOLD',   price: 500, G: '#ffd24d', L: '#fff3b8', D: '#e0a21c', PAW: '#fff8d6', PAWD: '#f0cc6a', PNK: '#ff9a6a', EYE: '#2d2433', COL: '#e8453c' },
    { name: 'COCOA',  price: 45,  G: '#a9744f', L: '#ead2b6', D: '#7c4f33', PAW: '#f2dec8', PAWD: '#c9a384', PNK: '#e8809a', EYE: '#ffe9a0', COL: '#ffd04a' },
    { name: 'MINT',   price: 80,  G: '#9ee6c4', L: '#effff7', D: '#6cbf9a', PAW: '#f4fffa', PAWD: '#b3e3cc', PNK: '#f6a9bb', EYE: '#2d2433', COL: '#ff6f91' },
    { name: 'CORAL',  price: 200, G: '#ff8f86', L: '#ffe1dc', D: '#d9625a', PAW: '#fff0ed', PAWD: '#f0aaa4', PNK: '#ffc2c8', EYE: '#2d2433', COL: '#4aa6d6' },
    { name: 'NIGHT',  price: 400, G: '#3f4a8a', L: '#7f8bd0', D: '#2a3266', PAW: '#9aa5e0', PAWD: '#5560a8', PNK: '#e8809a', EYE: '#ffe27a', COL: '#ffd04a' }
  ];

  function leg(b, x0, y0, x1, y1, col, pal) {
    b.line(x0, y0, x1, y1, col, 3);
    b.rect(x1 - 1, y1 - 1, 3, 3, col === pal.D ? pal.PAWD : pal.PAW);
  }

  // pose: 'up' (leaping, legs stretched) | 'mid' (tucked) | 'fall' (legs dangling)
  // eyes: 'happy' | 'open' | 'blink' | 'wide' | 'dizzy'
  // pal: one of PALETTES (defaults to the gray cat)
  function makeCat(pose, eyes, pal) {
    pal = pal || PALETTES[0];
    var G = pal.G, L = pal.L, D = pal.D, PNK = pal.PNK, EYE = pal.EYE, COL = pal.COL;
    var b = new Buf(30, 26);
    var tails = {
      up:   [[5, 15], [3, 13], [3, 9], [4, 6], [6, 4]],
      mid:  [[5, 16], [3, 15], [2, 12], [3, 9], [5, 8]],
      fall: [[5, 13], [4, 10], [4, 6], [5, 3]],
      stand:[[5, 16], [3, 14], [2, 11], [3, 8], [5, 6]],
      run:  [[5, 15], [3, 14], [2, 12], [2, 9], [3, 7]]
    };
    var legs = {
      up:   { fb: [10, 18, 5, 22], nb: [8, 17, 3, 21], ff: [16, 18, 23, 22], nf: [19, 18, 27, 21] },
      mid:  { fb: [10, 19, 10, 22], nb: [7, 18, 7, 22], ff: [15, 19, 15, 22], nf: [19, 19, 19, 22] },
      fall: { fb: [10, 19, 11, 23], nb: [7, 18, 4, 23], ff: [16, 18, 18, 23], nf: [19, 18, 24, 22] },
      stand:{ fb: [10, 19, 10, 23], nb: [7, 19, 7, 23], ff: [16, 19, 16, 23], nf: [19, 19, 19, 23] },
      run1: { fb: [10, 19, 7, 23], nb: [7, 19, 10, 22], ff: [16, 19, 19, 23], nf: [19, 19, 15, 22] },
      run2: { fb: [10, 18, 6, 22], nb: [7, 18, 12, 23], ff: [16, 18, 22, 22], nf: [19, 18, 16, 23] },
      run3: { fb: [10, 19, 13, 23], nb: [7, 19, 4, 22], ff: [16, 19, 13, 23], nf: [19, 19, 23, 22] }
    };
    var lg = legs[pose], t = tails[pose.indexOf('run')===0?'run':pose], i;

    // far legs (darker, behind everything)
    leg(b, lg.fb[0], lg.fb[1], lg.fb[2], lg.fb[3], D, pal);
    leg(b, lg.ff[0], lg.ff[1], lg.ff[2], lg.ff[3], D, pal);

    // tail with a light tip
    for (i = 0; i < t.length - 1; i++) b.line(t[i][0], t[i][1], t[i + 1][0], t[i + 1][1], G, 3);
    var tip = t[t.length - 1];
    b.rect(tip[0] - 1, tip[1] - 1, 3, 3, L);
    var pre = t[t.length - 2];
    b.set(Math.round((tip[0] + pre[0]) / 2), Math.round((tip[1] + pre[1]) / 2), L);

    // body + belly + tabby stripes
    b.ell(12, 15, 8.5, 5.5, G);
    b.ell(12, 18.5, 6.5, 2.8, L, G);
    [7, 10, 13].forEach(function (x) {
      for (var y = 9; y <= 13; y++) if (b.get(x, y) === G && (y === 9 || b.get(x, y - 1) === D || b.get(x, y - 1) === null || y <= 12)) {
        if (y <= 12 && b.get(x, y - 1) !== L) b.set(x, y, D);
      }
    });
    // keep stripes short: clear anything lower than 3 rows from the top edge
    [7, 10, 13].forEach(function (x) {
      var top = -1;
      for (var y = 0; y < 26; y++) if (b.get(x, y) !== null) { top = y; break; }
      for (var y2 = top + 3; y2 < top + 8; y2++) if (b.get(x, y2) === D) b.set(x, y2, G);
    });

    // near legs over the body
    leg(b, lg.nb[0], lg.nb[1], lg.nb[2], lg.nb[3], G, pal);
    leg(b, lg.nf[0], lg.nf[1], lg.nf[2], lg.nf[3], G, pal);

    // head
    b.ell(21, 11, 7.5, 6.5, G);
    // ears
    // small, neat triangle ears (mirrored around the head centre x=21)
    b.spans([[3, 16, 16], [4, 16, 17], [5, 15, 18], [6, 15, 18]], G);
    b.spans([[3, 26, 26], [4, 25, 26], [5, 24, 27], [6, 24, 27]], G);
    b.spans([[4, 16, 16], [5, 16, 17]], PNK);
    b.spans([[4, 26, 26], [5, 25, 26]], PNK);
    // forehead stripes
    b.dots([[21, 5], [21, 6], [19, 6], [23, 6]], D);
    // muzzle
    b.ell(21, 14.5, 3.6, 2.3, L, G);
    // cheeks
    b.dots([[16, 14], [17, 14], [25, 14], [26, 14]], BLUSH);
    // nose
    b.set(21, 14, NOSE);

    // eyes
    var left = 17, right = 24;
    if (eyes === 'happy') {                       // ^ ^
      b.dots([[16, 12], [17, 11], [18, 11], [19, 12]], EYE);
      b.dots([[26, 12], [25, 11], [24, 11], [23, 12]], EYE);
    } else if (eyes === 'blink') {                // - -
      b.span(12, left, left + 1, EYE);
      b.span(12, right, right + 1, EYE);
    } else if (eyes === 'wide') {                 // big round eyes
      b.rect(left - 1, 10, 3, 4, EYE); b.rect(right - 1 + 0, 10, 3, 4, EYE);
      b.set(left - 1, 10, WH); b.set(left, 10, WH); b.set(right - 1, 10, WH); b.set(right, 10, WH);
      b.set(left - 1, 11, WH); b.set(right - 1, 11, WH);
    } else if (eyes === 'dizzy') {                // x x
      b.dots([[16, 10], [18, 10], [17, 11], [16, 12], [18, 12]], EYE);
      b.dots([[26, 10], [24, 10], [25, 11], [26, 12], [24, 12]], EYE);
    } else {                                       // open, with sparkle
      b.rect(left, 10, 2, 3, EYE); b.rect(right, 10, 2, 3, EYE);
      b.set(left, 10, WH); b.set(right, 10, WH);
    }

    // mouth
    if (eyes === 'happy') {
      b.span(15, 20, 22, MOUTH); b.set(21, 16, TONG);
    } else if (eyes === 'wide') {
      b.span(15, 20, 22, MOUTH); b.set(21, 16, MOUTH);
    } else if (eyes === 'dizzy') {
      b.dots([[20, 16], [21, 15], [22, 16]], MOUTH);
    } else {
      b.dots([[20, 15], [22, 15]], MOUTH);
    }

    // collar with a little gold bell
    b.span(17, 18, 24, COL);
    b.rect(20, 18, 3, 2, BELL); b.set(20, 18, WH); b.set(22, 19, BELLD);

    // pixel shading
    b.edge(G, D, 0, 1);
    b.outline(OUT);
    return b;
  }

  // ---- FOODS (16x16 each) -----------------------------------------------------
  var C = {
    RED: '#ff4f6d', REDD: '#d23a58', REDL: '#ff9ab0', GRN: '#62d062', GRND: '#3f9b4a', YEL: '#ffe27a',
    TAN: '#eab565', TAND: '#c98e43', TANL: '#f8d594', CHOC: '#6b3f2a',
    PINK: '#ff9ec1', PINKD: '#e96f9d', PINKL: '#ffd0e2',
    CRM: '#fff4d6', CRMD: '#ecd9a0', WHT: '#ffffff', WHTD: '#dde2f0',
    BLU: '#6ec6f2', BLUD: '#4aa6d6', BLUL: '#bfe8fb',
    GLD: '#ffd04a', GLDD: '#e8a830', ORG: '#e0a050', ORGD: '#b97a30',
    BRN: '#b5651d', BRNL: '#d98a3a', NORI: '#2f4a3f', NORIL: '#47705c', SPG: '#ffd98a', SPGD: '#e8b25e'

const UNLOCKALL=/unlockall/.test(location.hash);
const SPELLS=[{id:'bolt',n:'STAR BOLT',s:'BOLT',cost:20,w:0,d:'Fires a star that defeats foes'},{id:'veil',n:'MOON VEIL',s:'VEIL',cost:45,w:3,d:'3 seconds of invulnerability'},{id:'nova',n:'STAR NOVA',s:'NOVA',cost:60,w:6,d:'A blast that clears nearby foes'}];
function worldsCleared(){let w=0;while(w<LEVELS.length/5&&save.stars[w*5+4]!==undefined)w++;return w;}
const dLv=()=>save.diff===undefined?1:save.diff,DIFFN=['EASY','NORMAL','HARD'],DOFF=[-.4,0,.45],JETSP=[.75,1,1.25];

function doClaw(){const p=P;if(p.clawCd>0||G.dead>0)return;p.clawCd=.34;p.claw=.2;SFX.claw();
 const box={x:p.face>0?p.x+p.w-1:p.x-19,y:p.y-3,w:20,h:18};
 for(const e of G.en){if(e.dead||!act(e.d))continue;const b=hb(e);if(!ov(box,b))continue;
  if(e.t==='boss'){if(e.inv<=0&&bossVul(e))bossHit(e);else if(e.inv<=0){pop(e.x+8,e.y-8,'CLANG!','#c9c6ff');SFX.nope();e.inv=.35;}}
  else{killEnemy(e);puff(e.x+e.w/2,e.y+e.h/2,'#ffffff',6,70);}}
 for(const q of G.proj)if(q.x>box.x-4&&q.x<box.x+box.w&&Math.abs(q.y-(box.y+8))<12){q.life=0;pop(q.x-10,q.y-8,'DEFLECT','#ffd0e8');puff(q.x,q.y,'#ff6ab0',6,60);}}
function castSpell(){const p=P;if(p.castCd>0||G.dead>0)return;const i=spellSel(),s=SPELLS[i];
 if(p.mp<s.cost){pop(p.x-14,p.y-12,'NEED MANA','#9fa8ff');SFX.nope();p.castCd=.3;return;}
 p.mp-=s.cost;p.castCd=.35;stat('cast');
 if(s.id==='bolt'){G.bolts.push({x:p.x+5+p.face*9,y:p.y+6,vx:p.face*240,life:1.2,face:p.face});SFX.bolt();puff(p.x+5+p.face*8,p.y+6,'#fff6a8',5,40);}
 else if(s.id==='veil'){p.veil=3.5;SFX.heart();puff(p.x+5,p.y+6,'#bfe9ff',16,70);pop(p.x-12,p.y-14,'MOON VEIL','#bfe9ff');}
 else{SFX.nova();G.nova={x:p.x+5,y:p.y+6,t:0};G.shake=.25;G.flash=.35;
  for(const e of G.en){if(e.dead||!act(e.d))continue;if(Math.hypot(e.x+e.w/2-(p.x+5),e.y+e.h/2-(p.y+6))>86)continue;
   if(e.t==='boss'){if(e.inv<=0&&bossVul(e))bossHit(e);else if(e.inv<=0){pop(e.x+8,e.y-8,'RESISTED','#c9c6ff');e.inv=.4;}}else{killEnemy(e);puff(e.x+e.w/2,e.y+e.h/2,'#fff6a8',8,80);}}
  G.proj=G.proj.filter(q=>Math.hypot(q.x-(p.x+5),q.y-(p.y+6))>86);}}
function updateCombat(dt){const p=P;p.clawCd=Math.max(0,p.clawCd-dt);p.claw=Math.max(0,p.claw-dt);p.veil=Math.max(0,p.veil-dt);p.castCd=Math.max(0,p.castCd-dt);
 p.mp=Math.min(p.maxmp,p.mp+(p.ground?8:5)*(perkOn(4)?2:1)*dt);if(G.nova){G.nova.t+=dt;if(G.nova.t>.5)G.nova=null;}

function conveyV(p){if(!p.ground||p.swing)return 0;const ty=Math.floor((p.y+p.h+1)/TS);for(const x of [Math.floor((p.x+2)/TS),Math.floor((p.x+8)/TS)]){const t=(L.g[ty]||[])[x];if(t===12)return -52;if(t===13)return 52;}return 0;}
function mechPre(dt){for(const m of G.mp){const nx=m.x0+m.ax*Math.sin(G.time*m.sp+m.ph),ny=m.y0+m.ay*Math.sin(G.time*m.sp+m.ph);m.dx=nx-m.x;m.dy=ny-m.y;m.x=nx;m.y=ny;

 P.mpOn=null;}
function mechPost(dt,pb0){const p=P;
 // moving platforms (stand on top, jump through from below)
 if(!p.swing)for(const m of G.mp){if(p.vy>=0&&p.x+p.w>m.x+1&&p.x<m.x+m.w-1&&p.y+p.h>=m.y-1&&pb0<=m.y+3+Math.max(0,m.dy)+p.vy*dt){p.y=m.y-p.h;p.vy=0;p.ground=true;p.jumps=0;p.mpOn=m;break;}}

 // crumbling tiles

  if(c.st===1&&c.t<=0){c.st=2;c.t=2.8;puff(tx*TS+8,ty*TS+8,'#b9a27a',8,50);}
  else if(c.st===2&&c.t<=0){const r={x:tx*TS,y:ty*TS,w:TS,h:TS};if(!ov({x:p.x,y:p.y,w:p.w,h:p.h},r)){c.st=0;}else c.t=.3;}}
 // hazards
 const pbx={x:p.x+1,y:p.y+1,w:p.w-2,h:p.h-1};
 for(const h of G.haz){
  if(h.t==='saw'){h.x+=h.dir*40*(1+L.de*.5)*dt;h.rot+=dt*14;if(h.x>h.x0+h.rg){h.dir=-1;}if(h.x<h.x0-h.rg){h.dir=1;}if(ov(pbx,{x:h.x+1,y:h.y+1,w:10,h:10}))hurt(h.x+6);}
  else{const ph=(G.time*JETSP[dLv()]+h.ph)%2.6;h.on=ph<1.4?0:ph<1.9?1:2;if(h.on===1&&Math.random()<.4)G.parts.push({x:h.x+4+Math.random()*8,y:h.y-4,vx:0,vy:-30,life:.3,c:'#ffb347',s:1});
   if(h.on===2){if(!h.snd){h.snd=1;SFX.jet();}if(ov(pbx,{x:h.x+3,y:h.y-46,w:10,h:46}))hurt(h.x+8);}else h.snd=0;}}
 // arena gauntlet
 const g=G.gaunt;if(g){
  if(g.st===0&&p.x>g.x+TS*3&&p.x<g.x+g.w-TS*3){g.st=1;g.wave=0;g.t=1;L.gateT=L.gateT||[];const tx0=Math.floor(g.x/TS),tx1=Math.floor((g.x+g.w)/TS)-1;
   for(const tx of [tx0,tx1])for(let y=4;y<14;y++)if(L.g[y][tx]===0){L.g[y][tx]=2;L.gateT.push([tx,y]);}SFX.boss();G.shake=.3;pop(p.x-18,p.y-24,'ARENA!','#ff9aff');}
  else if(g.st===1){g.t-=dt;const alive=G.en.filter(e=>e.gnt&&!e.dead).length;
   if(g.t<=0&&alive===0){if(g.wave>=g.n){g.st=2;for(const q of L.gateT||[])L.g[q[1]][q[0]]=0;G.shake=.3;SFX.win();pop(p.x-30,p.y-26,'ARENA CLEARED!','#ffe85a');P.mp=P.maxmp;G.items.push({k:'heart',x:g.x+g.w/2,y:13*TS+8,d:0,got:false});for(let i=0;i<6;i++)G.items.push({k:'coin',x:g.x+g.w/2-24+i*10,y:12*TS,d:0,got:false});}
    else{g.wave++;g.t=1.4;const cnt=2+g.wave+Math.round(L.de*2);for(let i=0;i<cnt;i++){const kind=g.foes[Math.floor(Math.random()*g.foes.length)],sx=g.x+TS*2+Math.random()*(g.w-TS*4),e=spawnFoe(kind,sx,i%2?TS*5:TS*12);if(e){e.gnt=true;G.en.push(e);puff(e.x+6,e.y+6,'#ff9aff',8,60);}}SFX.boss();}}}}}

const BA={
 split(e,ph){const n=2+ph;for(let i=0;i<n;i++){const m=mkSlime(e.x+10,e.y-6,0,i%2?1:-1,L.world);m.vy=-170;m.mini=true;G.en.push(m);}puff(e.x+e.w/2,e.y,'#7be37b',10,80);pop(e.x,e.y-14,'SPLIT!','#7be37b');},

function bossGim(e,dt,bd){if(!bd.g||bd.g==='split'||e.dead)return;e.gt=(e.gt===undefined?5.5:e.gt)-dt;
 if(e.gt<=0){const ph=e.ph2?1:0,list=Array.isArray(bd.g)?bd.g:[bd.g];e.gi=e.gi||0;const a=list[e.gi%list.length];e.gi++;if(BA[a])BA[a](e,ph);e.gt=(bd.gp||6)*(ph?.72:1);}}
function bhazUpdate(dt){

 if(G.windWarn>0)G.windWarn-=dt;else if(G.windT>0){G.windT-=dt;if(!P.swing&&G.dead<=0)moveX(P,G.windV*dt);}

 for(const h of G.bhaz){
  if(h.k==='strike'){if(h.st===0){h.t-=dt;if(h.t<=0){h.st=1;h.t=.3;if(h.h>=BFL)G.shake=.2;beep(h.root?210:140,.12,'sawtooth',.04);puff(h.x,h.y0+h.h,h.col,6,60);}}
   else{h.t-=dt;if(G.dead<=0&&ov(pbx,{x:h.x-h.w/2,y:h.y0,w:h.w,h:h.h})){hurt(h.x);if(h.root&&p.inv>1.5)G.rootT=1.4;}if(h.t<=0)h.dead=true;}}
  else if(h.k==='fall'){if(h.d>0){h.d-=dt;continue;}h.y+=h.vy*dt;h.x+=h.vx*dt;if(G.dead<=0&&ov(pbx,{x:h.x-h.w/2,y:h.y-h.h/2,w:h.w,h:h.h})){hurt(h.x);h.dead=true;puff(h.x,h.y,h.col,5,50);}else if(h.y>=BFL-h.h/2){h.dead=true;puff(h.x,BFL-2,h.col,5,50);}}
  else if(h.k==='ball'){h.vy+=h.g*dt;h.x+=h.vx*dt;h.y+=h.vy*dt;if(h.y+h.r>=BFL){h.y=BFL-h.r;if(h.b>0){h.vy=-Math.abs(h.vy)*.88;h.b--;}else{h.dead=true;puff(h.x,h.y,h.col,6,50);}}if(h.x<8||h.x>L.W*TS-8)h.vx*=-1;
   if(G.dead<=0&&Math.abs(h.x-(p.x+5))<h.r+4&&Math.abs(h.y-(p.y+6))<h.r+6){hurt(h.x);h.dead=true;}}
  else if(h.k==='roll'){if(h.d>0){h.d-=dt;continue;}h.x+=h.vx*dt;h.rot+=dt*10*Math.sign(h.vx);if(h.x<-16||h.x>L.W*TS+16)h.dead=true;if(G.dead<=0&&Math.abs(h.x-(p.x+5))<h.r+3&&Math.abs(h.y-(p.y+6))<h.r+5)hurt(h.x);}}
 G.bhaz=G.bhaz.filter(h=>!h.dead);}

  if(M(x,y)){const t=(y-y0)/Math.max(1,y1-y0);c=pal.base;if(t>.7)c=pal.shade;if(!M(x,y+1)||!M(x+1,y))c=t>.5?pal.deep:pal.shade;if(!M(x,y-1)||!M(x-1,y))c=opt.nohi?pal.base:pal.hi;}

const Music=(()=>{
 const SC={maj:[0,2,4,5,7,9,11],min:[0,2,3,5,7,8,10],dor:[0,2,3,5,7,9,10],mix:[0,2,4,5,7,9,10],phr:[0,1,3,5,7,8,10],lyd:[0,2,4,6,7,9,11],pent:[0,2,4,7,9]};
 const WS=['maj','mix','lyd','maj','dor','min','phr','min','lyd','mix','dor','min','maj','min','pent','mix','min','dor','phr','min'];
 const PROG=[[0,5,3,4],[0,3,4,3],[0,4,5,3],[0,2,5,4],[5,3,0,4],[0,5,2,4]];
 const RH=['x.x.x.xxx.x.x.xx','x..x..x.x..x..x.','xx.xx.xxxx.xx.x.','x...x...x.xxx...','x.xx.x.xx.xx.x.x'];
 let bus=null,filt=null,nbuf=null,cur=null,tr=null,step=0,nextT=0;

 function setup(){bus=AC.createGain();bus.gain.value=0;filt=AC.createBiquadFilter();filt.type='lowpass';filt.frequency.value=18000;bus.connect(filt);filt.connect(AC.destination);
  nbuf=AC.createBuffer(1,Math.floor(AC.sampleRate*.4),AC.sampleRate);const d=nbuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;setInterval(sched,30);}
 function build(key){let sd=0;for(const ch of String(key))sd=(sd*31+ch.charCodeAt(0))>>>0;const r=()=>{sd=(sd*1664525+1013904223)>>>0;return sd/4294967296;};
  const menu=key==='menu',boss=String(key)[0]==='b',w=menu?0:(boss?+String(key).slice(1):+key)|0;
  const sc=SC[menu?'pent':boss?(w%2?'phr':'min'):WS[w%WS.length]],n=sc.length;
  const t={sc,n,root:45+((w*5)%12)+(boss?-2:0),bpm:menu?86:boss?146+Math.min(20,w):104+Math.floor(w*2.2),menu,boss,prog:PROG[Math.floor(r()*PROG.length)],lead:[],energetic:!menu&&(boss||w>=3)};
  const hits=Math.floor(r()*RH.length);
  for(let b=0;b<4;b++){const c=t.prog[b],pat=RH[(hits+(b%2?1:0))%RH.length],row=[];let prev=c+7+2;
   for(let k=0;k<16;k++){if(pat[k]!=='x'||(menu&&k%4))row.push(null);else{const tones=[c,c+2,c+4,c+7];let d=r()<.65?tones[Math.floor(r()*4)]+7:prev+(r()<.5?-1:1)*(r()<.7?1:2);if(d<c+3)d+=n;if(d>c+16)d-=n;row.push(d);prev=d;}}t.lead.push(row);}
  return t;}
 const nt=(t,d)=>t.root+t.sc[((d%t.n)+t.n)%t.n]+12*Math.floor(d/t.n);
 function tone(f,at,d,type,v){const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(.0001,at);g.gain.linearRampToValueAtTime(v,at+.006);g.gain.exponentialRampToValueAtTime(.0001,at+d);o.connect(g);g.connect(bus);o.start(at);o.stop(at+d+.03);}

 function kick(at,v){const o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(150,at);o.frequency.exponentialRampToValueAtTime(42,at+.12);g.gain.setValueAtTime(v,at);g.gain.exponentialRampToValueAtTime(.0001,at+.17);o.connect(g);g.connect(bus);o.start(at);o.stop(at+.2);}
 function playStep(s,at,sd){const t=tr,bar=Math.floor(s/16)%4,k=s%16,c=t.prog[bar];
  const bassHit=t.energetic?[0,3,6,8,11,14].includes(k):[0,8].includes(k);
  if(bassHit)tone(hz(nt(t,c-7+((k===6||k===14)&&t.energetic?7:0))),at,sd*(t.energetic?1.6:3),'triangle',.55);
